<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang!</title>
    <style>
        /* Pengaturan Dasar Halaman */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Latar belakang gelap */
            color: #ffffff; /* Teks putih */
            overflow: hidden; /* Menghilangkan scrollbar */
        }

        /* Kontainer Utama untuk Penataan di Tengah */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh; /* Mengisi seluruh tinggi layar */
            padding: 20px;
            box-sizing: border-box;
        }

        /* Styling untuk Judul */
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #bb86fc; /* Warna aksen ungu muda */
            animation: fadeInDown 1s ease-out;
        }

        /* Styling untuk Gambar/GIF */
        .bumper-gif {
            max-width: 90%;
            width: 500px; /* Atur lebar maksimal GIF */
            height: auto;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(187, 134, 252, 0.3); /* Memberi efek bayangan bercahaya */
            margin-top: 20px;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease-out 0.5s;
            animation-fill-mode: backwards; /* Memastikan animasi tetap di state awal sebelum dimulai */
        }
        
        /* Styling untuk Teks Deskripsi */
        p {
            font-size: 1.25rem;
            color: #e0e0e0;
            animation: fadeInUp 1s ease-out 1s;
            animation-fill-mode: backwards;
        }

        /* Animasi Sederhana */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sesuatu yang Hebat Akan Datang</h1>
        
        <img src="bumper1.gif" alt="Animasi Bumper" class="bumper-gif">
        
        <p>Nantikan pembaruan dari kami!</p>
    </div>

</body>
</html>
